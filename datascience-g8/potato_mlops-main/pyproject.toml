[project]
name = "potato-mlops"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potato_mlops"]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }
